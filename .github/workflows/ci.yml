name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Validate template manifests, assets, contrast, and stress renders
        run: npm run template:validate

      - name: Check template previews
        run: npm run template:preview -- --check

      - name: Check generated template index
        run: npm run template:index -- --check

      - name: Build production bundle
        run: npm run build

      - name: End-to-end smoke test
        run: npm run test:e2e -- tests/e2e/smoke.spec.ts tests/e2e/typographyStage2.spec.ts tests/e2e/templateCompositionStage3.spec.ts
